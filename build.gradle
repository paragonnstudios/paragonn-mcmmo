shadowJar {
    archiveFileName = 'paragonn-mmo.jar'
    
    // Relocations as per pom.xml
    relocate 'net.kyori', 'com.gmail.nossr50.mcmmo.kyori'
    relocate 'co.aikar.commands', 'com.gmail.nossr50.mcmmo.acf'
    relocate 'co.aikar.locales', 'com.gmail.nossr50.mcmmo.locales'
    relocate 'org.apache.commons.logging', 'com.gmail.nossr50.mcmmo.commons.logging'
    relocate 'org.apache.juli', 'com.gmail.nossr50.mcmmo.database.tomcat.juli'
    relocate 'org.apache.tomcat', 'com.gmail.nossr50.mcmmo.database.tomcat'
    relocate 'org.bstats', 'com.gmail.nossr50.mcmmo.metrics.bstats'
    relocate 'com.tcoded.folialib', 'com.gmail.nossr50.mcmmo.folialib'
}

processResources {
    def props = [
        'project': [
            'version': project.version,
            'artifactId': rootProject.name,
            'name': rootProject.name
        ],
        'BUILD_NUMBER': System.getenv('BUILD_NUMBER') ?: 'CUSTOM'
    ]
    inputs.properties props
    filteringCharset 'UTF-8'

    filesMatching(['**/*.yml', '**/*.properties']) {
        filter { line ->
            line.replace('${project.version}', (String)project.version)
                .replace('${project.artifactId}', (String)rootProject.name)
                .replace('${project.name}', (String)rootProject.name)
                .replace('${BUILD_NUMBER}', (String)(System.getenv('BUILD_NUMBER') ?: 'CUSTOM'))
        }
    }

    // Locales mapping (Remapping to com/gmail/nossr50/locale as in Maven)
    from('src/main/resources/locale/') {
        include 'locale*.properties'
        into 'com/gmail/nossr50/locale'
        filter { line ->
            line.replace('${project.version}', (String)project.version)
                .replace('${project.artifactId}', (String)rootProject.name)
                .replace('${project.name}', (String)rootProject.name)
                .replace('${BUILD_NUMBER}', (String)(System.getenv('BUILD_NUMBER') ?: 'CUSTOM'))
        }
    }

    // Mods mapping
    from('src/main/resources/mods') {
        include '*.yml'
        into 'mods'
        filter { line ->
            line.replace('${project.version}', (String)project.version)
                .replace('${project.artifactId}', (String)rootProject.name)
                .replace('${project.name}', (String)rootProject.name)
                .replace('${BUILD_NUMBER}', (String)(System.getenv('BUILD_NUMBER') ?: 'CUSTOM'))
        }
    }

    // License inclusion
    from(projectDir) {
        include 'LICENSE'
    }
}

// Clean up default resources output to avoid duplicates from custom mappings above
// (src/main/resources/locale would otherwise end up in both locale/ and com/gmail/nossr50/locale/)
sourceSets.main.resources.srcDirs.each { srcDir ->
    processResources.exclude { details ->
        details.file.path.startsWith(new File(srcDir, 'locale').path) ||
        details.file.path.startsWith(new File(srcDir, 'mods').path)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += ["-parameters"]
}

test {
    useJUnitPlatform()
}

// Make shadowJar the primary output
build.dependsOn shadowJar
