    testImplementation 'com.h2database:h2:2.1.214' // Older version for Java 8
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'org.testcontainers:testcontainers:1.19.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.20.0'
    testImplementation 'org.testcontainers:mysql:1.19.3'
    testImplementation 'org.testcontainers:mariadb:1.19.3'
    testImplementation 'com.mysql:mysql-connector-j:8.2.0'
    testImplementation 'org.mariadb.jdbc:mariadb-java-client:3.2.0'
